<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YABAI P.U.G. AR Preview</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body { font-family: sans-serif; margin: 0; background: #fdfdfd; color: #222; text-align: center; }
        header { padding: 40px 20px; background: #333; color: #fff; }
        .brand { font-size: 1.8rem; letter-spacing: 3px; font-weight: bold; margin: 0; }
        .tagline { font-size: 0.7rem; opacity: 0.8; margin-top: 5px; }
        
        .card { max-width: 400px; margin: 30px auto; background: #fff; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); overflow: hidden; padding-bottom: 20px; }
        
        /* ARビューワー設定 */
        model-viewer { width: 100%; height: 400px; background-color: #eee; }
        
        .info { padding: 20px; }
        .title { font-size: 1.2rem; font-weight: bold; }
        .price { color: #e44d26; font-weight: bold; font-size: 1.3rem; margin: 10px 0; }
        
        .btn { display: inline-block; width: 80%; padding: 15px; background: #333; color: #fff; text-decoration: none; border-radius: 30px; font-weight: bold; }
        
        /* AR起動ボタンのカスタマイズ */
        .ar-button {
            background-color: #6b8e23; color: white; border: none;
            border-radius: 20px; padding: 10px 20px; position: absolute;
            bottom: 20px; left: 50%; transform: translateX(-50%); font-weight: bold;
        }
    </style>
</head>
<body>

<header>
    <p class="brand">YABAI P.U.G.</p>
    <p class="tagline">Printed / Unusual / Geometry</p>
</header>

<div class="card">
    <!-- Google提供のダミーモデルを使用 -->
    <model-viewer 
        src="フトアゴ.glb"
        scale="0.001 0.001 0.001"
        ar ar-modes="webxr scene-viewer quick-look" 
        camera-controls 
        shadow-intensity="1">
        <button slot="ar-button" class="ar-button">
            👋 自分の部屋に置く（AR）
        </button>
    </model-viewer>

    <div class="info">
        <div class="title">テスト用オブジェクト</div>
        <p>※ここは将来的にあなたのシェルターになります</p>
        <div class="price">¥0,000</div>
        <a href="#" class="btn">お問い合わせ</a>
    </div>
</div>

<p style="font-size: 0.8rem; color: #999;">iPhone 17で動作確認済み</p>

</body>
</html>
